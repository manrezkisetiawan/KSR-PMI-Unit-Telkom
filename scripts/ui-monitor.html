<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Monitor UI · KSR PMI</title>
    <style>
      :root {
        --bg: #f2eee8;
        --panel: #faf7f3;
        --surface: #ffffff;
        --fg: #15171a;
        --muted: #6b6f75;
        --border: #e2d9cf;
        --accent: #e4002b;
        --ok: #16794a;
        --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0b0d;
          --panel: #141417;
          --surface: #1d1d22;
          --fg: #f7f4ef;
          --muted: #a29c94;
          --border: #2b2b31;
          --accent: #ff3b47;
          --ok: #4ade80;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-columns: 260px 1fr;
        grid-template-rows: auto 1fr;
        font:
          14px/1.4 system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }

      /* Sidebar rute */
      aside {
        grid-row: 1 / span 2;
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--border);
        background: var(--panel);
        min-height: 0;
      }
      .brand {
        padding: 16px;
        border-bottom: 1px solid var(--border);
      }
      .brand b {
        display: block;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 6px;
        font: 12px var(--mono);
        color: var(--muted);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
      }
      .dot.up {
        background: var(--ok);
      }
      .search {
        margin: 12px 12px 4px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
      }
      nav {
        overflow-y: auto;
        padding: 4px 8px 16px;
      }
      nav h4 {
        margin: 12px 8px 4px;
        font: 600 11px var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      nav button {
        display: block;
        width: 100%;
        padding: 6px 8px;
        border: 0;
        border-radius: 6px;
        background: none;
        text-align: left;
        font: 13px var(--mono);
        cursor: pointer;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      nav button:hover {
        background: var(--surface);
      }
      nav button[aria-current='page'] {
        background: var(--accent);
        color: #fff;
      }

      /* Toolbar */
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
      }
      .path {
        flex: 1;
        min-width: 160px;
        font: 13px var(--mono);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .group {
        display: flex;
        gap: 4px;
        padding: 3px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
      }
      .chip {
        padding: 5px 10px;
        border: 0;
        border-radius: 7px;
        background: none;
        font-size: 13px;
        cursor: pointer;
      }
      .chip[aria-pressed='true'] {
        background: var(--fg);
        color: var(--bg);
      }
      .btn {
        padding: 6px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        cursor: pointer;
        text-decoration: none;
        font-size: 13px;
      }

      /* Frame perangkat */
      main {
        display: flex;
        align-items: flex-start;
        gap: 24px;
        padding: 20px;
        overflow: auto;
        min-height: 0;
      }
      figure {
        margin: 0;
        flex: none;
      }
      figcaption {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 6px;
        font: 12px var(--mono);
        color: var(--muted);
      }
      figcaption b {
        color: var(--fg);
        font-weight: 600;
      }
      .screen {
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
        box-shadow: 0 8px 24px rgb(0 0 0 / 0.08);
      }
      .screen iframe {
        display: block;
        border: 0;
        transform-origin: 0 0;
        background: #fff;
      }
      .empty {
        margin: auto;
        max-width: 420px;
        text-align: center;
        color: var(--muted);
      }
      .empty code {
        font-family: var(--mono);
        color: var(--fg);
      }
      kbd {
        font: 11px var(--mono);
        padding: 1px 5px;
        border: 1px solid var(--border);
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <aside>
      <div class="brand">
        <b>Monitor UI</b>
        <div class="status">
          <span class="dot" id="dot"></span><span id="statusText">memeriksa…</span>
        </div>
      </div>
      <input class="search" id="search" type="search" placeholder="Cari halaman…  ( / )" />
      <nav id="routes"></nav>
    </aside>

    <header>
      <div class="path" id="path">/</div>
      <div class="group" id="devices" aria-label="Ukuran layar"></div>
      <div class="group" id="scales" aria-label="Skala"></div>
      <button class="btn" id="reload" title="Muat ulang semua frame (R)">↻ Muat ulang</button>
      <a class="btn" id="open" target="_blank" rel="noopener">Buka ↗</a>
    </header>

    <main id="stage"></main>

    <script>
      const DEV_ORIGIN = '__DEV_ORIGIN__';
      const DEVICES = [
        { id: 'hp', label: 'HP', w: 390, h: 844 },
        { id: 'tablet', label: 'Tablet', w: 768, h: 1024 },
        { id: 'laptop', label: 'Laptop', w: 1280, h: 800 },
        { id: 'desktop', label: 'Desktop', w: 1440, h: 900 },
        { id: 'wide', label: 'Lebar', w: 1920, h: 1080 },
      ];
      const SCALES = [
        { id: 'fit', label: 'Pas' },
        { id: '0.5', label: '50%' },
        { id: '0.75', label: '75%' },
        { id: '1', label: '100%' },
      ];

      const store = {
        get(key, fallback) {
          try {
            const v = localStorage.getItem('ui-monitor:' + key);
            return v === null ? fallback : JSON.parse(v);
          } catch {
            return fallback;
          }
        },
        set(key, value) {
          try {
            localStorage.setItem('ui-monitor:' + key, JSON.stringify(value));
          } catch {}
        },
      };

      const state = {
        routes: [],
        route: store.get('route', '/'),
        devices: store.get('devices', ['hp', 'tablet', 'desktop']),
        scale: store.get('scale', 'fit'),
      };

      const $ = (id) => document.getElementById(id);

      function renderToggles() {
        $('devices').innerHTML = DEVICES.map(
          (d) =>
            `<button class="chip" data-device="${d.id}" aria-pressed="${state.devices.includes(d.id)}" title="${d.w}×${d.h}">${d.label}</button>`,
        ).join('');
        $('scales').innerHTML = SCALES.map(
          (s) =>
            `<button class="chip" data-scale="${s.id}" aria-pressed="${state.scale === s.id}">${s.label}</button>`,
        ).join('');
      }

      function renderRoutes() {
        const q = $('search').value.trim().toLowerCase();
        const groups = {};
        for (const r of state.routes) {
          if (q && !r.toLowerCase().includes(q)) continue;
          const key = r.split('/')[1] || 'beranda';
          (groups[key] ||= []).push(r);
        }
        $('routes').innerHTML = Object.entries(groups)
          .map(
            ([g, list]) =>
              `<h4>${g}</h4>` +
              list
                .map(
                  (r) =>
                    `<button data-route="${r}" ${r === state.route ? 'aria-current="page"' : ''} title="${r}">${r}</button>`,
                )
                .join(''),
          )
          .join('');
      }

      function scaleFor(device) {
        if (state.scale !== 'fit') return Number(state.scale);
        const avail = $('stage').clientHeight - 40 - 24;
        return Math.min(1, avail / device.h);
      }

      function renderStage() {
        $('path').textContent = state.route;
        $('open').href = DEV_ORIGIN + state.route;
        const active = DEVICES.filter((d) => state.devices.includes(d.id));
        if (!active.length) {
          $('stage').innerHTML = '<p class="empty">Pilih minimal satu ukuran layar.</p>';
          return;
        }
        $('stage').innerHTML = active
          .map((d) => {
            const s = scaleFor(d);
            return `<figure>
              <figcaption><b>${d.label}</b><span>${d.w}×${d.h} · ${Math.round(s * 100)}%</span></figcaption>
              <div class="screen" style="width:${d.w * s}px;height:${d.h * s}px">
                <iframe src="${DEV_ORIGIN + state.route}" width="${d.w}" height="${d.h}"
                  style="transform:scale(${s})" title="${d.label} ${state.route}" loading="lazy"></iframe>
              </div>
            </figure>`;
          })
          .join('');
      }

      function selectRoute(route) {
        state.route = route;
        store.set('route', route);
        renderRoutes();
        renderStage();
        document.querySelector('nav [aria-current]')?.scrollIntoView({ block: 'nearest' });
      }

      function step(delta) {
        const visible = [...document.querySelectorAll('nav button')].map((b) => b.dataset.route);
        const i = visible.indexOf(state.route);
        const next = visible[Math.max(0, Math.min(visible.length - 1, i + delta))];
        if (next) selectRoute(next);
      }

      document.addEventListener('click', (e) => {
        const t = e.target.closest('button');
        if (!t) return;
        if (t.dataset.route) selectRoute(t.dataset.route);
        if (t.dataset.device) {
          const id = t.dataset.device;
          state.devices = state.devices.includes(id)
            ? state.devices.filter((x) => x !== id)
            : DEVICES.map((d) => d.id).filter((x) => x === id || state.devices.includes(x));
          store.set('devices', state.devices);
          renderToggles();
          renderStage();
        }
        if (t.dataset.scale) {
          state.scale = t.dataset.scale;
          store.set('scale', state.scale);
          renderToggles();
          renderStage();
        }
      });

      $('reload').addEventListener('click', renderStage);
      $('search').addEventListener('input', renderRoutes);

      document.addEventListener('keydown', (e) => {
        if (e.target === $('search')) {
          if (e.key === 'Escape') $('search').blur();
          return;
        }
        if (e.key === '/') {
          e.preventDefault();
          $('search').focus();
        } else if (e.key === 'ArrowDown' || e.key === 'j') {
          e.preventDefault();
          step(1);
        } else if (e.key === 'ArrowUp' || e.key === 'k') {
          e.preventDefault();
          step(-1);
        } else if (e.key === 'r') {
          renderStage();
        }
      });

      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => state.scale === 'fit' && renderStage(), 150);
      });

      async function loadRoutes() {
        try {
          state.routes = await (await fetch('/api/routes')).json();
        } catch {
          state.routes = ['/'];
        }
        if (!state.routes.includes(state.route)) state.route = state.routes[0];
        renderRoutes();
        renderStage();
      }

      let wasUp = false;
      async function pollStatus() {
        let up = false;
        try {
          up = (await (await fetch('/api/status')).json()).up;
        } catch {}
        $('dot').classList.toggle('up', up);
        $('statusText').textContent = up
          ? DEV_ORIGIN.replace('http://', '') + ' aktif'
          : 'dev server belum siap…';
        if (up && !wasUp) loadRoutes();
        if (!up && !state.routes.length) {
          $('stage').innerHTML =
            '<p class="empty">Menunggu dev server di <code>' +
            DEV_ORIGIN +
            '</code>…<br />Kompilasi pertama bisa memakan waktu sekitar 30 detik.</p>';
        }
        wasUp = up;
        setTimeout(pollStatus, up ? 5000 : 1500);
      }

      renderToggles();
      pollStatus();
    </script>
  </body>
</html>
